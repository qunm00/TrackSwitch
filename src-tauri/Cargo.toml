[package]
name = "trackswitch"
version = "0.1.1"
description = "Move an Apple Magic Trackpad between two Macs with Bluetooth re-pairing"
edition = "2021"

[lib]
name = "trackswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mdns-sd = "0.13"
tauri-plugin-updater = "2"
