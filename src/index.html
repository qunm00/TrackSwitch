<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrackSwitch</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 16px;
        margin: 0;
      }
      label {
        display: block;
        margin-top: 12px;
      }
      select,
      input {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
      }
      #status {
        margin-top: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>TrackSwitch</h1>
    <label for="device">Trackpad</label>
    <select id="device"></select>
    <label for="peer">Other Mac name</label>
    <input id="peer" type="text" placeholder="Mac B" />
    <button type="submit" id="save">Save</button>
    <p id="status"></p>
    <script src="main.js"></script>
  </body>
</html>
